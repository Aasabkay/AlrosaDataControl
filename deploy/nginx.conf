# Прокси: статика фронтенда + API на том же домене.
# Фронт собран с пустым VITE_API_URL, поэтому ходит на свой же origin.

server {
    listen 80;
    server_name alrosadatacontrol.top www.alrosadatacontrol.top _;

    root /usr/share/nginx/html;
    index index.html;

    # Файлы до 100 МБ (лимит API) + запас на multipart-обёртку.
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Проверка домена для Let's Encrypt (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA: любой неизвестный путь отдаём как index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Эндпоинты API — на контейнер api.
    location ~ ^/(sources|imports|reconciliations|health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

