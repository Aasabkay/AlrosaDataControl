# Прод-стек для VPS: база + API + nginx со статикой фронтенда.
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Секреты — в deploy/.env (рядом с этим файлом, в репозиторий не попадает).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Для образа PG18 том монтируется в /var/lib/postgresql (не .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт базы наружу не открываем: доступ только из сети compose.

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      UPLOAD_DIR: /app/uploads
      REPORT_ORGANIZATION: ${REPORT_ORGANIZATION:-}
      REPORT_RESPONSIBLE: ${REPORT_RESPONSIBLE:-}
    volumes:
      - uploads-data:/app/uploads
    # Порт не публикуем: снаружи только nginx.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  pgdata:
  uploads-data:
